name: Semgrep SAST

on:
  push:
    branches: [ "master", "main" ]

jobs:
  semgrep:
    name: Run Semgrep SAST
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
